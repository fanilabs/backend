name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg_version="$(node -p "require('./package.json').version")"
          expected="v${pkg_version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Release tag '$tag' does not match package.json version '$pkg_version' (expected tag '$expected')."
            exit 1
          fi
          echo "Release tag '$tag' matches package.json version '$pkg_version'."

      - name: Draft release notes
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
