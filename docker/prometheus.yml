# Local starter scrape config — see docker-compose.yml's `observability`
# profile and docs/OBSERVABILITY.md. A real deployment's Prometheus config
# lives with whatever monitoring stack that environment already runs, not
# here; this is for looking at this backend's own /metrics locally.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: fanilab-backend-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
