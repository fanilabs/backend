# pnpm workspace configuration.
#
# The authoritative pnpm version for this repo is the `packageManager` field in
# package.json (currently pnpm@10.33.0). CI selects that exact release via
# Corepack, so contributors should do the same:
#
#   corepack prepare pnpm@10.33.0 --activate
#   pnpm --version   # must print 10.33.0 before installing
#   pnpm install --frozen-lockfile
#
# The `engines.pnpm` range in package.json (>=9) is only a minimum
# compatibility floor, not the recommended/tested toolchain. When the
# `packageManager` pin changes, update the version in the commands above to
# match it.

packages:
  - '.'

allowBuilds:
  - esbuild
  - sharp
